syntax = "proto3";

package controller.api.resources.aliases.v1;

import "controller/api/resources/scopes/v1/scope.proto";
import "controller/custom_options/v1/options.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/opendumpling/opendumpling/sdk/pbs/controller/api/resources/aliases;aliases";

// Alias contains all fields related to an Alias resource
message Alias {
  // Output only. The ID of the Alias.
  string id = 10; // @gotags: `class:"public"`

  // The ID of the scope of which this Alias is a part.
  string scope_id = 20 [json_name = "scope_id"]; // @gotags: `class:"public"`

  // Output only. Scope information for this Alias.
  resources.scopes.v1.ScopeInfo scope = 30;

  // Optional user-set name for identification purposes.
  google.protobuf.StringValue name = 40 [
    (custom_options.v1.generate_sdk_option) = true,
    (custom_options.v1.mask_mapping) = {
      this: "name"
      that: "name"
    }
  ]; // @gotags: `class:"public"`

  // Optional user-set description for identification purposes.
  google.protobuf.StringValue description = 50 [
    (custom_options.v1.generate_sdk_option) = true,
    (custom_options.v1.mask_mapping) = {
      this: "description"
      that: "description"
    }
  ]; // @gotags: `class:"public"`

  // The DNS-like string a user types to reach the destination. It has to be
  // unique within the Alias's scope.
  google.protobuf.StringValue value = 60 [
    (custom_options.v1.generate_sdk_option) = true,
    (custom_options.v1.mask_mapping) = {
      this: "value"
      that: "value"
    }
  ]; // @gotags: `class:"public"`

  // The ID of the resource the Alias points at.
  google.protobuf.StringValue destination_id = 70 [
    (custom_options.v1.generate_sdk_option) = true,
    (custom_options.v1.mask_mapping) = {
      this: "destination_id"
      that: "destination_id"
    }
  ]; // @gotags: `class:"public"`

  // Output only. The type of the destination resource, for example "target".
  string destination_type = 80 [json_name = "destination_type"]; // @gotags: `class:"public"`

  // Output only. The time this resource was created.
  google.protobuf.Timestamp created_time = 90 [json_name = "created_time"]; // @gotags: `class:"public"`

  // Output only. The time this resource was last updated.
  google.protobuf.Timestamp updated_time = 100 [json_name = "updated_time"]; // @gotags: `class:"public"`

  // Version is used in mutation requests, after the initial creation, to ensure this resource has not changed.
  // The mutation will fail if the version does not match the latest known good version.
  uint32 version = 110; // @gotags: `class:"public"`

  // Output only. The available actions on this resource for this user.
  repeated string authorized_actions = 300 [json_name = "authorized_actions"]; // @gotags: `class:"public"`
}
