name: Release

# Pushing a tag like "v0.13.1" builds every downloadable asset and pushes a
# multi-arch container image to GHCR.
#
# Everything is kept in one self-contained job on purpose: GitHub's
# actions/download-artifact@v4 is unreliable on hosted runners right now
# (fails to fetch artifacts from the blob store even for tiny files), so no
# cross-job artifact hand-off is used. The job builds all 18 archives, writes
# SHA256SUMS, and uploads everything to the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.23.x'
  CGO_ENABLED: '0'

jobs:
  build:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            version="$(cat version/VERSION)"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cd out
          platforms="darwin/amd64 darwin/arm64 \
            freebsd/386 freebsd/amd64 freebsd/arm \
            linux/386 linux/amd64 linux/arm linux/arm64 \
            netbsd/386 netbsd/amd64 netbsd/arm \
            openbsd/386 openbsd/amd64 openbsd/arm \
            solaris/amd64 \
            windows/386 windows/amd64"
          for p in ${platforms}; do
            os="${p%/*}"
            arch="${p#*/}"
            ext=""
            if [ "${os}" = "windows" ]; then ext=".exe"; fi
            echo "==> Building ${os}_${arch}"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -tags=dumpling \
              -ldflags "-s -w \
                -X github.com/opendumpling/opendumpling/version.GitCommit=${GITHUB_SHA} \
                -X github.com/opendumpling/opendumpling/version.Version=${VERSION} \
                -X github.com/opendumpling/opendumpling/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dumpling${ext}" ../cmd/dumpling
            zip -j "dumpling_${VERSION}_${os}_${arch}.zip" "dumpling${ext}"
            rm -f "dumpling${ext}"
          done
          sha256sum ./*.zip > SHA256SUMS
          echo "---- out/ contents ----"
          ls -la

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: out
        run: |
          gh release create "${TAG}" --title "OpenDumpling ${VERSION}" \
            --notes "OpenDumpling ${VERSION}" || true
          gh release upload "${TAG}" ./*.zip SHA256SUMS --clobber
          gh release edit "${TAG}" --draft=false --title "OpenDumpling ${VERSION}"

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat version/VERSION)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/opendumpling/opendumpling:${{ steps.version.outputs.version }}
            ghcr.io/opendumpling/opendumpling:latest