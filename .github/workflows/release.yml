name: Release

# One-time setup: pushing a tag like "v0.13.1" builds every downloadable asset
# and pushes a multi-arch container image to GHCR. Nothing else to do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Cross-compiled release archives. Mirrors the upstream Boundary v0.13.1 asset
  # list (same OS/arch set), as "dumpling_<version>_<os>_<arch>.zip".
  # ---------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: freebsd, goarch: 386}
          - {goos: freebsd, goarch: amd64}
          - {goos: freebsd, goarch: arm}
          - {goos: linux, goarch: 386}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm}
          - {goos: linux, goarch: arm64}
          - {goos: netbsd, goarch: 386}
          - {goos: netbsd, goarch: amd64}
          - {goos: netbsd, goarch: arm}
          - {goos: openbsd, goarch: 386}
          - {goos: openbsd, goarch: amd64}
          - {goos: openbsd, goarch: arm}
          - {goos: solaris, goarch: amd64}
          - {goos: windows, goarch: 386}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Use the tag as the embedded version
        if: github.ref_type == 'tag'
        run: echo "${GITHUB_REF_NAME#v}" > version/VERSION

      - name: Build and zip
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="$(cat version/VERSION)"
          BIN=dumpling
          [ "${GOOS}" = windows ] && BIN=dumpling.exe
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG=github.com/opendumpling/opendumpling/version
          LDFLAGS="-X ${PKG}.GitCommit=${GITHUB_SHA}"
          LDFLAGS="${LDFLAGS} -X ${PKG}.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X ${PKG}.BuildDate=${BUILD_DATE}"
          go build -trimpath -tags=dumpling -ldflags "${LDFLAGS}" -o "${BIN}" ./cmd/dumpling
          mkdir -p out
          zip -q "out/dumpling_${VERSION}_${GOOS}_${GOARCH}.zip" "${BIN}"

      - uses: actions/upload-artifact@v4
        with:
          name: dumpling-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish the archives + checksums as a GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    if: github.ref_type == 'tag'
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only pull the archives published by the "binaries" matrix. Docker's
      # build-push-action leaves a stray "*.dockerbuild" artifact in the run,
      # which is not a zip and makes download-artifact@v4 fail after 5 retries;
      # the pattern keeps it out.
      - uses: actions/download-artifact@v4
        with:
          pattern: dumpling-*
          path: out
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: out
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum ./*.zip > "dumpling_${VERSION}_SHA256SUMS"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "OpenDumpling ${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" out/* --clobber

  # ---------------------------------------------------------------------------
  # Build and push the multi-arch container image to GHCR:
  #   ghcr.io/opendumpling/opendumpling:<version>  (and :latest)
  # ---------------------------------------------------------------------------
  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha

      # The image embeds the version into the binary, so the build-arg must be
      # the bare version (no leading "v").
      - name: Use the tag as the embedded version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat version/VERSION)"
          fi
          echo "${VERSION}" > version/VERSION
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
