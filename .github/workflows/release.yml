name: Release

# Pushing a tag like "v0.13.1" builds every downloadable asset and pushes a
# multi-arch container image to GHCR. Each build job uploads its own zip
# straight to the GitHub Release, so the release job never has to download the
# large binaries (actions/download-artifact is too flaky for that).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.23.x'

jobs:
  # ---------------------------------------------------------------------------
  # Compute version/tag and create (or reuse) a draft release when running on a
  # tag. Every other job depends on this, so the release exists before any
  # asset upload happens.
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            version="$(cat version/VERSION)"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create draft release (tagged runs only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" --draft --notes "OpenDumpling ${TAG}" \
            || gh release edit "${TAG}" --draft=true \
            || true

  # ---------------------------------------------------------------------------
  # Cross-compiled release archives. Mirrors the upstream Boundary v0.13.1
  # asset list (same OS/arch set), as "dumpling_<version>_<os>_<arch>.zip".
  # ---------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: freebsd, goarch: 386}
          - {goos: freebsd, goarch: amd64}
          - {goos: freebsd, goarch: arm}
          - {goos: linux, goarch: 386}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm}
          - {goos: linux, goarch: arm64}
          - {goos: netbsd, goarch: 386}
          - {goos: netbsd, goarch: amd64}
          - {goos: netbsd, goarch: arm}
          - {goos: openbsd, goarch: 386}
          - {goos: openbsd, goarch: amd64}
          - {goos: openbsd, goarch: arm}
          - {goos: solaris, goarch: amd64}
          - {goos: windows, goarch: 386}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -tags=dumpling \
            -ldflags "-s -w \
              -X github.com/opendumpling/opendumpling/version.GitCommit=${GITHUB_SHA} \
              -X github.com/opendumpling/opendumpling/version.Version=${VERSION} \
              -X github.com/opendumpling/opendumpling/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dumpling${ext}" ./cmd/dumpling

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="dumpling_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "${name}" dumpling.exe
          else
            zip -j "${name}" dumpling
          fi
          sha256sum "${name}" > "sha256sums.txt"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload zip to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" "${{ steps.package.outputs.name }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sha256sums.txt
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assemble SHA256SUMS from the small per-job checksums and publish the release
  # (once all zips are attached).
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sums
          pattern: sums-*
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: sums
        run: |
          rm -f SHA256SUMS
          cat ./*.txt | sort > SHA256SUMS
          wc -l SHA256SUMS

      - name: Publish checksums and finalize release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "${TAG}" sums/SHA256SUMS --clobber
          gh release edit "${TAG}" --draft=false --title "OpenDumpling ${VERSION}"

  # ---------------------------------------------------------------------------
  # Multi-arch container image.
  # ---------------------------------------------------------------------------
  docker:
    name: container image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/opendumpling/opendumpling:${{ needs.prepare.outputs.version }}
            ghcr.io/opendumpling/opendumpling:latest